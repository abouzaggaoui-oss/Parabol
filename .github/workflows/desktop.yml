name: Desktop (macOS + Windows)

# Builds the Electron desktop app in desktop/ for macOS (one .dmg for Intel and Apple
# Silicon) and Windows (installer + portable .exe) and publishes them as a GitHub release
# "desktop-v<version>" when that release doesn't exist yet.
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "desktop-v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release desktop-v$version already exists, nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  mac:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            label: AppleSilicon
          - arch: x64
            label: Intel
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install (ffmpeg for ${{ matrix.arch }})
        env:
          npm_config_arch: ${{ matrix.arch }}
        run: |
          npm install --no-audit --no-fund
          file node_modules/ffmpeg-static/ffmpeg
      - name: Build Parabol.app (${{ matrix.label }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dir --${{ matrix.arch }} --publish never
      - name: Ad-hoc sign and package as .dmg
        run: |
          set -e
          app=$(find dist -maxdepth 2 -name "Parabol.app" -type d | head -1)
          echo "App: $app"
          file "$app/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg"
          # No Apple developer certificate: an ad-hoc signature is required for Apple Silicon to run it.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --verbose=2 "$app"
          mkdir -p dmgroot
          cp -R "$app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Parabol" -srcfolder dmgroot -ov -format UDZO "Parabol-Desktop-${{ needs.version.outputs.version }}-macOS-${{ matrix.label }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: desktop/Parabol-Desktop-*-macOS-*.dmg

  windows:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win --x64 --publish never
      - name: Rename
        run: |
          v=${{ needs.version.outputs.version }}
          mkdir -p out
          cp "dist/Parabol Setup $v.exe" "out/Parabol-Desktop-$v-Windows-Setup.exe"
          cp "dist/Parabol $v.exe" "out/Parabol-Desktop-$v-Windows-Portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/out/*.exe

  release:
    needs: [version, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Parabol Desktop ${{ needs.version.outputs.version }} (macOS + Windows)
          make_latest: false
          body: |
            Parabol voor de computer.

            - **macOS**: `…-macOS-AppleSilicon.dmg` voor Macs met een M-chip (M1/M2/M3/M4…), `…-macOS-Intel.dmg` voor oudere Macs met een Intel-processor (Apple-menu › Over deze Mac laat zien welke je hebt). Openen, Parabol naar Apps slepen. De eerste keer: rechtsklik op Parabol › Open (of Systeeminstellingen › Privacy en beveiliging › Toch openen), omdat de app niet bij Apple is geregistreerd.
            - **Windows**: `…-Windows-Setup.exe` (installer) of `…-Windows-Portable.exe` (zonder installatie).
          files: files/*
