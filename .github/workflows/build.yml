name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      # Shows compiler errors as annotations on the run page, so they can be read
      # without downloading the full log.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          errors=$(grep -E '^e: |What went wrong|^> [^T]|requires|Dependency .* requires|compileSdk' build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${errors}"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parabol-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
