name: Release APK

# A release is created automatically whenever the app's versionName changes on main
# (e.g. 1.5.0 -> 1.6.0), or when a v* tag is pushed. Existing releases are never
# overwritten: if the version already has a release, the job just skips.
on:
  push:
    branches: [main]
    paths:
      - 'app/build.gradle.kts'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed release APK
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error title=Signing key missing::Add the secrets ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/parabol-release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/parabol-release.jks"
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --no-daemon 2>&1 | tee build.log || {
            errors=$(grep -E '^e: |What went wrong|^> [^T]|FAILED|Error:|Caused by|lint' build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Release build errors::${errors}"
            exit 1
          }
          # Fail if the APK isn't signed with the registered Parabol key.
          # With minSdk 24+ the APK only has the v2 signature, which keytool can't read: use apksigner.
          EXPECTED="d64b181b3e6c7415e4dfe3a5c8194147337e9fa52167f8b765e944ad5cbef99d"
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -q "SHA-256 digest: $EXPECTED" \
            || { echo "::error title=Wrong signing key::APK fingerprint does not match the registered key"; exit 1; }

      - name: Rename APK to include version
        if: steps.version.outputs.skip != 'true'
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Parabol-${{ steps.version.outputs.tag }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "Parabol-${{ steps.version.outputs.tag }}.aab"

      - name: Create GitHub Release with APK attached
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Parabol ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            Parabol-${{ steps.version.outputs.tag }}.apk
            Parabol-${{ steps.version.outputs.tag }}.aab
          generate_release_notes: true
